<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

<body class="bg-off-white font-['Inter'] text-deep-charcoal overflow-hidden">
    <div class="relative w-full h-screen flex flex-col items-center justify-center text-center">
        <!-- Background Video -->
        <video class="absolute inset-0 w-full h-full object-cover" style="filter: brightness(0.7);" autoplay loop muted playsinline>
            <source src="../assets/hero_bg.mp4" type="video/mp4">
        </video>
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent"></div>
        
        <div class="relative z-10 px-6 max-w-2xl mx-auto flex flex-col items-center">
            <div class="size-20 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center mb-6 shadow-xl border border-white/30">
                <span class="material-symbols-outlined text-white text-[40px]">flight_takeoff</span>
            </div>
            <h1 class="text-white text-5xl md:text-6xl font-bold leading-tight mb-4 drop-shadow-lg">Discover Your Next Adventure</h1>
            <p class="text-white/90 text-lg md:text-xl mb-10 font-medium drop-shadow">Join Traveloop to craft breathtaking itineraries, track budgets, and share memories.</p>
            
            <button onclick="window.location.href='../auth/code.html'" class="group relative overflow-hidden bg-purple-heritage text-white text-lg font-bold py-4 px-12 rounded-full shadow-[0_10px_20px_rgba(113,75,103,0.4)] hover:-translate-y-1 hover:shadow-[0_15px_25px_rgba(113,75,103,0.6)] transition-all duration-300">
                <span class="relative z-10 flex items-center gap-2">
                    Get Started <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
                </span>
            </button>
            <p class="mt-6 text-white/70 text-sm cursor-pointer hover:text-white transition-colors" onclick="window.location.href='../auth/code.html'">Already have an account? Log in</p>
        </div>

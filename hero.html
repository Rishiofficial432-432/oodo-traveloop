<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Traveloop | Your Journey, Perfected</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            "colors": {
              "purple-heritage": "#714B67",
              "teal-primary": "#017E84",
              "deep-charcoal": "#111827",
              "neutral-charcoal": "#374151",
              "divider-gray": "#DEE2E6",
              "off-white": "#F9F9FF",
              "pale-gray": "#F3F4F6",
              "success-green": "#28A745",
              "error-red": "#DC3545"
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #000; }
        .hero-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.6);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center overflow-hidden">
<video autoplay="" class="hero-video" loop="" muted="" playsinline="">
<source src="https://cdn.pixabay.com/video/2019/12/17/30349-381015694_large.mp4" type="video/mp4"/>
</video>
<div class="z-10 text-center px-6 max-w-4xl">
<div class="mb-8 flex justify-center">
<div class="w-20 h-20 bg-white/10 backdrop-blur-xl rounded-3xl flex items-center justify-center border border-white/20 shadow-2xl animate-bounce">
<span class="material-symbols-outlined text-white text-5xl">travel_explore</span>
</div>
</div>
<h1 class="text-white text-5xl md:text-7xl font-bold tracking-tight mb-6">
            Travel <span class="text-purple-heritage italic font-['Caveat']">Redefined</span>
</h1>
<p class="text-white/80 text-xl md:text-2xl font-light mb-12 max-w-2xl mx-auto leading-relaxed">
            Plan, organize, and experience your dream adventures with Traveloop. Your premium companion for world-class travel planning.
        </p>
<div class="flex flex-col md:flex-row items-center justify-center gap-6">
<button class="w-full md:w-auto px-10 py-5 bg-white text-deep-charcoal font-bold rounded-2xl text-xl shadow-2xl hover:scale-105 transition-transform" onclick="window.location.href='auth.html'">
                Get Started Free
            </button>
<button class="w-full md:w-auto px-10 py-5 glass-card text-white font-bold rounded-2xl text-xl hover:bg-white/20 transition-all" onclick="window.location.href='explore.html'">
                Explore Destinations
            </button>
</div>
<div class="mt-16 flex items-center justify-center gap-8 text-white/60">
<div class="flex flex-col items-center">
<span class="text-3xl font-bold text-white">100+</span>
<span class="text-xs uppercase tracking-widest">Cities</span>
</div>
<div class="h-8 w-px bg-white/20"></div>
<div class="flex flex-col items-center">
<span class="text-3xl font-bold text-white">10k+</span>
<span class="text-xs uppercase tracking-widest">Trips</span>
</div>
<div class="h-8 w-px bg-white/20"></div>
<div class="flex flex-col items-center">
<span class="text-3xl font-bold text-white">4.9/5</span>
<span class="text-xs uppercase tracking-widest">Rating</span>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="global.js"></script>
<script>
        // Hero specific logic to handle video play on mobile
        document.addEventListener('click', () => {
            const video = document.querySelector('video');
            if (video.paused) video.play();
        }, { once: true });
    </script>
</body>
</html>

<main class="flex-1 max-w-[1280px] mx-auto w-full px-container-h py-lg space-y-lg">
<section class="flex flex-col items-center pt-8 gap-4 w-full">
<h1 class="text-deep-charcoal text-[32px] font-bold leading-tight tracking-tight">Explore the World</h1>
<p class="text-neutral-charcoal text-body-reg mb-4">Search for destinations, flights, and travel inspiration.</p>

<div class="w-full max-w-2xl relative flex gap-2">
    <select id="searchType" class="p-4 rounded-xl border border-divider-gray shadow-sm focus:border-purple-heritage focus:ring-2 focus:ring-purple-heritage/20 text-deep-charcoal bg-white outline-none cursor-pointer">
        <option value="web">Web Search</option>
        <option value="poi">City POIs</option>
    </select>
    <div class="relative flex-1">
        <input type="text" id="searchInput" placeholder="e.g. Best hotels in Tokyo..." class="w-full p-4 pl-12 rounded-xl border border-divider-gray shadow-sm focus:border-purple-heritage focus:ring-2 focus:ring-purple-heritage/20 text-deep-charcoal bg-white outline-none transition-all text-lg">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-neutral-charcoal">search</span>
        <button id="searchBtn" class="absolute right-2 top-1/2 -translate-y-1/2 px-6 py-2 bg-purple-heritage text-white font-bold rounded-lg hover:bg-purple-dark transition-colors shadow-sm text-button-reg cursor-pointer">
            Search
        </button>
    </div>
</div>

<!-- Loading State -->
<div id="loadingIndicator" class="hidden mt-8">
    <span class="material-symbols-outlined animate-spin text-[32px] text-purple-heritage">progress_activity</span>
</div>

<!-- Results Container -->
<div id="resultsContainer" class="w-full mt-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-20">
    <!-- Results will be injected here -->
</div>
</section>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const searchBtn = document.getElementById('searchBtn');
    const searchInput = document.getElementById('searchInput');
    const searchType = document.getElementById('searchType');
    const resultsContainer = document.getElementById('resultsContainer');
    const loadingIndicator = document.getElementById('loadingIndicator');

    searchType.addEventListener('change', () => {
        if(searchType.value === 'poi') {
            searchInput.placeholder = "Enter a city name (e.g. Paris)...";
        } else {
            searchInput.placeholder = "e.g. Best hotels in Tokyo...";
        }
    });

    async function performSearch() {
        const query = searchInput.value.trim();
        if (!query) return;

        loadingIndicator.classList.remove('hidden');
        resultsContainer.innerHTML = '';

        try {
            if (searchType.value === 'web') {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                loadingIndicator.classList.add('hidden');

                if (data.organic_results && data.organic_results.length > 0) {
                    data.organic_results.forEach(result => {
                        const card = document.createElement('a');
                        card.href = result.link;
                        card.target = "_blank";
                        card.className = "bg-white p-4 rounded-xl border border-divider-gray hover:border-purple-heritage hover:shadow-lg transition-all group flex flex-col gap-2";
                        
                        card.innerHTML = `
                            <h3 class="font-bold text-lg text-deep-charcoal group-hover:text-purple-heritage transition-colors line-clamp-2">${result.title}</h3>
                            <p class="text-sm text-neutral-charcoal line-clamp-3">${result.snippet}</p>
                            <span class="text-xs text-teal-primary mt-auto pt-2">${result.source || 'Visit site'}</span>
                        `;
                        resultsContainer.appendChild(card);
                    });
                } else {
                    resultsContainer.innerHTML = `<p class="text-neutral-charcoal col-span-full text-center py-8">No results found for "${query}". Try another search.</p>`;
                }
            } else {
                // POI Search
                const response = await fetch(`/api/poi?city=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                loadingIndicator.classList.add('hidden');

                if (data.error) {
                    resultsContainer.innerHTML = `<p class="text-error-red col-span-full text-center py-8">${data.error}</p>`;
                    return;
                }

                if (data.pois && data.pois.length > 0) {
                    // Header for city
                    const header = document.createElement('div');
                    header.className = "col-span-full mb-4";
                    header.innerHTML = `<h2 class="text-2xl font-bold text-deep-charcoal">Top attractions in ${data.city}, ${data.country}</h2>`;
                    resultsContainer.appendChild(header);

                    data.pois.forEach(poi => {
                        if (!poi.name) return; // Skip unnamed POIs
                        const kinds = poi.kinds.split(',').map(k => k.replace(/_/g, ' ')).slice(0, 2).join(' • ');
                        
                        const card = document.createElement('div');
                        card.className = "bg-white p-4 rounded-xl border border-divider-gray hover:border-teal-primary hover:shadow-lg transition-all flex flex-col gap-2";
                        
                        card.innerHTML = `
                            <div class="flex items-start justify-between">
                                <h3 class="font-bold text-lg text-deep-charcoal line-clamp-2">${poi.name}</h3>
                                <span class="bg-teal-primary/10 text-teal-primary text-xs px-2 py-1 rounded font-bold">★ ${poi.rate}</span>
                            </div>
                            <p class="text-sm text-neutral-charcoal capitalize mt-1">${kinds}</p>
                            <div class="mt-auto pt-3 flex gap-2">
                                <a href="https://www.google.com/maps/search/?api=1&query=${poi.point.lat},${poi.point.lon}" target="_blank" class="text-xs font-bold text-purple-heritage hover:underline flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[16px]">map</span> View on Map
                                </a>
                            </div>
                        `;
                        resultsContainer.appendChild(card);
                    });
                } else {
                    resultsContainer.innerHTML = `<p class="text-neutral-charcoal col-span-full text-center py-8">No popular attractions found in "${query}".</p>`;
                }
            }
        } catch (err) {
            console.error(err);
            loadingIndicator.classList.add('hidden');
            resultsContainer.innerHTML = `<p class="text-error-red col-span-full text-center py-8">Failed to fetch results. Please try again.</p>`;
        }
    }

    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') performSearch();
    });
});
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>My Trips | Traveloop</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            "colors": {
              "purple-heritage": "#714B67",
              "teal-primary": "#017E84",
              "deep-charcoal": "#111827",
              "neutral-charcoal": "#374151",
              "divider-gray": "#DEE2E6",
              "off-white": "#F9F9FF",
              "pale-gray": "#F3F4F6",
              "success-green": "#28A745",
              "error-red": "#DC3545"
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body { font-family: 'Inter', sans-serif; background-color: #f9f9ff; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen pb-24">
<!-- Header -->
<header class="flex items-center px-6 h-16 border-b border-divider-gray bg-white sticky top-0 z-40">
<button onclick="window.location.href='traveloop_dashboard.html'" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-pale-gray transition-colors">
<span class="material-symbols-outlined text-deep-charcoal">arrow_back</span>
</button>
<div class="flex-1 text-center pr-10">
<h1 class="text-xl font-bold text-deep-charcoal">My Adventures</h1>
</div>
<button onclick="window.location.href='plan_a_new_trip.html'" class="bg-purple-heritage text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm hover:bg-purple-dark transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-sm">add</span> New Trip
    </button>
</header>
<main class="max-w-5xl mx-auto p-6">
<!-- Stats Overview -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
<div class="bg-white p-4 rounded-2xl border border-divider-gray shadow-sm">
<p class="text-xs text-neutral-charcoal font-medium uppercase tracking-wider">Total Trips</p>
<p class="text-2xl font-bold text-deep-charcoal mt-1" id="stat-total">0</p>
</div>
<div class="bg-white p-4 rounded-2xl border border-divider-gray shadow-sm">
<p class="text-xs text-neutral-charcoal font-medium uppercase tracking-wider">Upcoming</p>
<p class="text-2xl font-bold text-teal-primary mt-1" id="stat-upcoming">0</p>
</div>
<div class="bg-white p-4 rounded-2xl border border-divider-gray shadow-sm">
<p class="text-xs text-neutral-charcoal font-medium uppercase tracking-wider">Completed</p>
<p class="text-2xl font-bold text-purple-heritage mt-1" id="stat-completed">0</p>
</div>
<div class="bg-white p-4 rounded-2xl border border-divider-gray shadow-sm">
<p class="text-xs text-neutral-charcoal font-medium uppercase tracking-wider">Countries</p>
<p class="text-2xl font-bold text-neutral-charcoal mt-1" id="stat-countries">0</p>
</div>
</div>
<!-- Trip List -->
<div class="space-y-6" id="trip-list">
<!-- Skeleton Loader -->
<div class="animate-pulse space-y-4">
<div class="h-48 bg-pale-gray rounded-3xl w-full"></div>
<div class="h-48 bg-pale-gray rounded-3xl w-full"></div>
</div>
</div>
</main>
<!-- Bottom Navigation (MacOS Dock Style) -->
<div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50">
<nav class="flex h-[58px] items-center justify-center gap-2 rounded-2xl border border-divider-gray bg-white/80 p-2 backdrop-blur-md shadow-lg">
<a class="flex aspect-square size-10 items-center justify-center rounded-full text-neutral-charcoal hover:bg-pale-gray" href="traveloop_dashboard.html">
<span class="material-symbols-outlined">home</span>
</a>
<a class="flex aspect-square size-10 items-center justify-center rounded-full text-purple-heritage bg-purple-heritage/10" href="my_trips.html">
<span class="material-symbols-outlined">work</span>
</a>
<a class="flex aspect-square size-10 items-center justify-center rounded-full text-neutral-charcoal hover:bg-pale-gray" href="explore.html">
<span class="material-symbols-outlined">explore</span>
</a>
<a class="flex aspect-square size-10 items-center justify-center rounded-full text-neutral-charcoal hover:bg-pale-gray" href="budget_planner.html">
<span class="material-symbols-outlined">payments</span>
</a>
<a class="flex aspect-square size-10 items-center justify-center rounded-full text-neutral-charcoal hover:bg-pale-gray" href="profile.html">
<span class="material-symbols-outlined">person</span>
</a>
</nav>
</div>
<script src="global.js"></script>
<script>
        async function loadTrips() {
            if (!window.db) {
                setTimeout(loadTrips, 500);
                return;
            }
            
            const trips = await window.db.trips.orderBy('id').reverse().toArray();
            const tripList = document.getElementById('trip-list');
            
            if (trips.length === 0) {
                tripList.innerHTML = `
                    <div class="text-center py-20 bg-white rounded-3xl border border-divider-gray">
                        <span class="material-symbols-outlined text-6xl text-pale-gray mb-4">luggage</span>
                        <h2 class="text-xl font-bold text-deep-charcoal">No trips found</h2>
                        <p class="text-neutral-charcoal mt-2">Start by creating your first adventure!</p>
                        <button onclick="window.location.href='plan_a_new_trip.html'" class="mt-6 bg-purple-heritage text-white px-8 py-3 rounded-xl font-bold shadow-md hover:bg-purple-dark transition-all">
                            Plan a New Trip
                        </button>
                    </div>
                `;
                updateStats(0, 0, 0, 0);
                return;
            }

            tripList.innerHTML = trips.map(trip => `
                <div class="bg-white rounded-3xl border border-divider-gray shadow-sm overflow-hidden flex flex-col md:flex-row group transition-all hover:shadow-md hover:border-purple-heritage/30">
                    <div class="md:w-64 h-48 md:h-auto relative overflow-hidden">
                        ${trip.video_url ? 
                            `<video src="${trip.video_url}" class="absolute inset-0 w-full h-full object-cover" muted autoplay loop playsinline></video>` :
                            `<div class="absolute inset-0 bg-center bg-cover transition-transform duration-500 group-hover:scale-105" style='background-image: url("${trip.image_url || 'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&q=80&w=1000'}");'></div>`
                        }
                        <div class="absolute top-4 left-4 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-[10px] font-bold text-purple-heritage uppercase tracking-wider">
                            ${trip.status || 'Planned'}
                        </div>
                    </div>
                    <div class="p-6 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start">
                                <h3 class="text-2xl font-bold text-deep-charcoal">${trip.name}</h3>
                                <div class="flex gap-2">
                                    <button onclick="deleteTrip(${trip.id})" class="p-2 text-neutral-charcoal hover:text-error-red transition-colors">
                                        <span class="material-symbols-outlined text-xl">delete</span>
                                    </button>
                                </div>
                            </div>
                            <div class="flex flex-wrap gap-4 mt-3">
                                <div class="flex items-center gap-1.5 text-neutral-charcoal text-sm">
                                    <span class="material-symbols-outlined text-[18px]">calendar_today</span>
                                    <span>${trip.date || 'Flexible'}</span>
                                </div>
                                <div class="flex items-center gap-1.5 text-neutral-charcoal text-sm">
                                    <span class="material-symbols-outlined text-[18px]">group</span>
                                    <span>${trip.travelers || '2'} People</span>
                                </div>
                                <div class="flex items-center gap-1.5 text-teal-primary text-sm font-bold">
                                    <span class="material-symbols-outlined text-[18px]">payments</span>
                                    <span>$${calculateTotalBudget(trip.budget)}</span>
                                </div>
                            </div>
                            <p class="text-sm text-neutral-charcoal mt-4 line-clamp-2">${trip.description || 'No description provided.'}</p>
                        </div>
                        <div class="mt-6 flex flex-wrap gap-3">
                            <a href="itinerary_builder.html?tripId=${trip.id}" class="flex-1 min-w-[140px] bg-purple-heritage text-white text-center py-2.5 rounded-xl font-bold hover:bg-purple-dark transition-all text-sm shadow-sm">
                                Open Dashboard
                            </a>
                            <a href="budget_planner.html?tripId=${trip.id}" class="flex-1 min-w-[140px] bg-pale-gray text-deep-charcoal text-center py-2.5 rounded-xl font-bold hover:bg-divider-gray transition-all text-sm">
                                Budget Details
                            </a>
                            <a href="plan_a_new_trip.html?edit=${trip.id}" class="px-4 bg-white border border-divider-gray text-neutral-charcoal text-center py-2.5 rounded-xl font-bold hover:bg-pale-gray transition-all text-sm">
                                <span class="material-symbols-outlined text-[18px]">edit</span>
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');

            updateStats(trips.length, trips.filter(t => t.status === 'Upcoming').length, trips.filter(t => t.status === 'Completed').length, new Set(trips.map(t => t.destination)).size);
        }

        function calculateTotalBudget(budget) {
            if (!budget) return '0.00';
            return Object.values(budget).reduce((a, b) => a + b, 0).toLocaleString(undefined, {minimumFractionDigits: 2});
        }

        function updateStats(total, upcoming, completed, countries) {
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-upcoming').innerText = upcoming;
            document.getElementById('stat-completed').innerText = completed;
            document.getElementById('stat-countries').innerText = countries;
        }

        async function deleteTrip(id) {
            if (confirm("Are you sure you want to delete this trip and all its itinerary data?")) {
                await window.db.trips.delete(id);
                loadTrips();
            }
        }

        window.addEventListener('DOMContentLoaded', loadTrips);
    </script>
</body>
</html>

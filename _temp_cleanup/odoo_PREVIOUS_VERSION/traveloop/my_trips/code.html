<script>
    async function renderTrips() {
        const grid = document.getElementById('trips-grid');
        const placeholder = grid.lastElementChild; // Keep the 'Add Trip' card
        const trips = await getTrips();
        
        // Clear existing dynamic cards (everything except placeholder)
        while (grid.firstChild !== placeholder) {
            grid.removeChild(grid.firstChild);
        }

        if (trips.length === 0) {
            console.log("No trips found in Local DB.");
            return;
        }

        trips.forEach(trip => {
            const card = document.createElement('div');
            card.className = "flex flex-col bg-white border border-divider-gray rounded-xl overflow-hidden shadow-[0_3px_6px_0_rgba(0,0,0,0.05)] hover:shadow-[0_8px_16px_0_rgba(0,0,0,0.1)] transition-shadow group";
            
            const coverImage = trip.image_url || 'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&q=80&w=1000';
            const statusColor = trip.status === 'Past' ? 'text-neutral-charcoal' : 'text-purple-heritage';

            card.innerHTML = `
                <div class="relative h-48 w-full overflow-hidden">
                    ${trip.video_url ? 
                        `<video src="${trip.video_url}" autoplay muted loop class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"></video>` :
                        `<img alt="${trip.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="${coverImage}">`
                    }
                    <div class="absolute top-4 right-4 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest ${statusColor}">${trip.status || 'Upcoming'}</div>
                </div>
                <div class="p-6 flex flex-col gap-4">
                    <div>
                        <h3 class="text-deep-charcoal text-lg font-bold leading-tight mb-1">${trip.name}</h3>
                        <p class="text-neutral-charcoal text-sm flex items-center gap-1">
                            <span class="material-symbols-outlined" style="font-size: 16px;">calendar_month</span>
                            ${trip.date || 'Flexible Dates'}
                        </p>
                    </div>
                    <p class="text-xs text-neutral-charcoal line-clamp-2">${trip.description || 'No description added yet.'}</p>
                    <div class="flex items-center justify-between pt-4 border-t border-pale-gray">
                        <div class="flex gap-1">
                            <button onclick="window.location.href='../plan_a_new_trip/code.html?edit=${trip.id}'" class="p-2 text-neutral-charcoal hover:bg-pale-gray rounded-lg transition-colors cursor-pointer" title="Edit">
                                <span class="material-symbols-outlined" style="font-size: 20px;">edit</span>
                            </button>
                            <button onclick="handleDelete(${trip.id})" class="p-2 text-error-red hover:bg-error-container/20 rounded-lg transition-colors cursor-pointer" title="Delete">
                                <span class="material-symbols-outlined" style="font-size: 20px;">delete</span>
                            </button>
                        </div>
                        <button onclick="window.location.href='../traveloop_dashboard/code.html?tripId=${trip.id}'" class="bg-purple-heritage text-white px-5 py-2 rounded-lg text-sm font-bold shadow-sm hover:bg-purple-dark transition-colors cursor-pointer">
                            View Trip
                        </button>
                    </div>
                </div>
            `;
            grid.insertBefore(card, placeholder);
        });
    }

    async function handleDelete(id) {
        if (confirm('Are you sure you want to delete this trip?')) {
            const success = await deleteTrip(id);
            if (success) {
                renderTrips();
            } else {
                alert('Failed to delete trip.');
            }
        }
    }

    // Initialize and listen for changes
    document.addEventListener('DOMContentLoaded', renderTrips);
    subscribeToTable('trips', renderTrips);
</script>

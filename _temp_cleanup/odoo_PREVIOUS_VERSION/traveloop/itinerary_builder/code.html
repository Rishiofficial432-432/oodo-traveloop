<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const tripId = urlParams.get('id');

        if (!tripId) {
            console.error('No trip ID found');
            return;
        }

        const trip = await db.trips.get(Number(tripId));
        if (!trip) {
            document.getElementById('trip-name-display').innerText = 'Trip not found';
            return;
        }

        document.getElementById('trip-name-display').innerText = trip.name;
        document.getElementById('trip-date-display').innerText = trip.date;
        document.getElementById('trip-badge').innerText = trip.name.split(' ')[0].toUpperCase();

        const timelineContainer = document.getElementById('timeline-items');
        timelineContainer.innerHTML = '';

        if (trip.poi && trip.poi.length > 0) {
            trip.poi.forEach((poi, index) => {
                const itemHtml = `
                    <div class="relative pl-12 mb-lg">
                        <div class="absolute left-3 top-2 size-6 rounded-full bg-purple-heritage border border-white flex items-center justify-center z-10">
                            <span class="material-symbols-outlined text-[14px] text-white">location_on</span>
                        </div>
                        <div class="bg-white p-md rounded-xl border border-divider-gray shadow-sm hover:border-purple-heritage transition-all group">
                            <div class="flex gap-md">
                                <div class="w-16 shrink-0 text-center">
                                    <p class="text-xs font-bold text-neutral-charcoal">STOP ${index + 1}</p>
                                </div>
                                <div class="flex-1">
                                    <h5 class="font-bold text-deep-charcoal">${poi.name}</h5>
                                    <p class="text-[11px] text-neutral-charcoal">${poi.lat.toFixed(4)}, ${poi.lon.toFixed(4)}</p>
                                    <div class="mt-2 flex gap-2">
                                        <button onclick="window.location.href='../traveloop_dashboard/code.html?lat=${poi.lat}&lon=${poi.lon}&name=${encodeURIComponent(poi.name)}'" class="text-[10px] font-bold text-purple-heritage hover:underline">VIEW IN 3D</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                timelineContainer.insertAdjacentHTML('beforeend', itemHtml);
            });
        } else {
            timelineContainer.innerHTML = `
                <div class="text-center py-12 text-neutral-charcoal">
                    <span class="material-symbols-outlined text-4xl mb-2">map</span>
                    <p>No stops added to this trip yet.</p>
                </div>
            `;
        }
    });

    function goBack() {
        window.location.href = '../my_trips/code.html';
    }
</script>

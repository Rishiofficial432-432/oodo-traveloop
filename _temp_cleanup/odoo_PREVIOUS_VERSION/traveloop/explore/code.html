<main class="flex-1 max-w-[1280px] mx-auto w-full px-container-h py-lg space-y-lg">
<section class="flex flex-col items-center pt-8 gap-4 w-full">
<h1 class="text-deep-charcoal text-[32px] font-bold leading-tight tracking-tight">Explore the World</h1>
<p class="text-neutral-charcoal text-body-reg mb-4">Search for destinations, flights, and travel inspiration.</p>

<div class="w-full max-w-2xl relative flex gap-2">
    <select id="searchType" class="p-4 rounded-xl border border-divider-gray shadow-sm focus:border-purple-heritage focus:ring-2 focus:ring-purple-heritage/20 text-deep-charcoal bg-white outline-none cursor-pointer">
        <option value="web">Web Search</option>
        <option value="poi">City POIs</option>
        <option value="ai">AI Suggestions (Gemini)</option>
    </select>
    <div class="relative flex-1">
        <input type="text" id="searchInput" placeholder="e.g. Best hotels in Tokyo..." class="w-full p-4 pl-12 rounded-xl border border-divider-gray shadow-sm focus:border-purple-heritage focus:ring-2 focus:ring-purple-heritage/20 text-deep-charcoal bg-white outline-none transition-all text-lg">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-neutral-charcoal">search</span>
        <button id="searchBtn" class="absolute right-2 top-1/2 -translate-y-1/2 px-6 py-2 bg-purple-heritage text-white font-bold rounded-lg hover:bg-purple-dark transition-colors shadow-sm text-button-reg cursor-pointer">
            Search
        </button>
    </div>
</div>

<!-- Loading State -->
<div id="loadingIndicator" class="hidden mt-8">
    <span class="material-symbols-outlined animate-spin text-[32px] text-purple-heritage">progress_activity</span>
</div>

<!-- Results Container -->
<div id="resultsContainer" class="w-full mt-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-20">
    <!-- Results will be injected here -->
</div>
</section>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const searchBtn = document.getElementById('searchBtn');
    const searchInput = document.getElementById('searchInput');
    const searchType = document.getElementById('searchType');
    const resultsContainer = document.getElementById('resultsContainer');
    const loadingIndicator = document.getElementById('loadingIndicator');

    searchType.addEventListener('change', () => {
        if(searchType.value === 'poi') {
            searchInput.placeholder = "Enter a city name (e.g. Paris)...";
        } else {
            searchInput.placeholder = "e.g. Best hotels in Tokyo...";
        }
    });

    async function performSearch() {
        const query = searchInput.value.trim();
        if (!query) return;

        loadingIndicator.classList.remove('hidden');
        resultsContainer.innerHTML = '';

        // Simulate network delay
        await new Promise(r => setTimeout(r, 1000));
        loadingIndicator.classList.add('hidden');

        const mockData = {
            'paris': [
                { name: 'Eiffel Tower', lat: 48.8584, lon: 2.2945, desc: 'The iconic iron lady of Paris, offering breathtaking views of the city.' },
                { name: 'Louvre Museum', lat: 48.8606, lon: 2.3376, desc: 'The world\'s largest art museum and a historic monument in Paris.' },
                { name: 'Notre-Dame', lat: 48.8530, lon: 2.3499, desc: 'A medieval Catholic cathedral on the Île de la Cité.' }
            ],
            'tokyo': [
                { name: 'Shibuya Crossing', lat: 35.6595, lon: 139.7005, desc: 'The world\'s busiest pedestrian crossing, a symbol of modern Tokyo.' },
                { name: 'Tokyo Tower', lat: 35.6586, lon: 139.7454, desc: 'A communications and observation tower inspired by the Eiffel Tower.' },
                { name: 'Senso-ji Temple', lat: 35.7148, lon: 139.7967, desc: 'Tokyo\'s oldest temple, located in the historic Asakusa district.' }
            ],
            'london': [
                { name: 'Big Ben', lat: 51.5007, lon: -0.1246, desc: 'The Great Bell of the striking clock at the north end of the Palace of Westminster.' },
                { name: 'London Eye', lat: 51.5033, lon: -0.1195, desc: 'A cantilevered observation wheel on the South Bank of the River Thames.' },
                { name: 'Tower Bridge', lat: 51.5055, lon: -0.0754, desc: 'A combined bascule and suspension bridge, an iconic symbol of London.' }
            ]
        };

        const cityKey = query.toLowerCase();
        const results = mockData[cityKey] || [
            { name: `Secret Spot in ${query}`, lat: 40.7128, lon: -74.0060, desc: 'A hidden gem discovered by the Traveloop community. Explore it in 3D!' }
        ];

        const header = document.createElement('div');
        header.className = "col-span-full mb-4";
        header.innerHTML = `<h2 class="text-2xl font-bold text-deep-charcoal">Top discoveries in ${query}</h2>`;
        resultsContainer.appendChild(header);

        results.forEach(item => {
            const card = document.createElement('div');
            card.className = "bg-white p-6 rounded-2xl border border-divider-gray hover:border-purple-heritage hover:shadow-xl transition-all flex flex-col gap-3 group";
            
            card.innerHTML = `
                <h3 class="font-bold text-xl text-deep-charcoal group-hover:text-purple-heritage transition-colors">${item.name}</h3>
                <p class="text-sm text-neutral-charcoal leading-relaxed">${item.desc}</p>
                <div class="mt-auto pt-4 flex gap-2">
                    <button onclick="window.location.href='../traveloop_dashboard/code.html?lat=${item.lat}&lon=${item.lon}&name=${encodeURIComponent(item.name)}&city=${encodeURIComponent(query)}'" 
                            class="text-xs font-bold bg-purple-heritage/10 text-purple-heritage px-4 py-2 rounded-full hover:bg-purple-heritage hover:text-white transition-all flex items-center gap-2">
                        <span class="material-symbols-outlined text-[16px]">view_in_ar</span> View in 3D
                    </button>
                    <button onclick="alert('Added to your plan!')" class="text-xs font-bold bg-pale-gray text-deep-charcoal px-4 py-2 rounded-full hover:bg-divider-gray transition-all">
                        Add to Trip
                    </button>
                </div>
            `;
            resultsContainer.appendChild(card);
        });
    }

    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') performSearch();
    });
});
</script>
<style>

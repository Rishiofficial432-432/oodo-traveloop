<body class="flex items-center justify-center min-h-screen">
<div class="w-full max-w-[480px] min-h-screen bg-off-white-light flex flex-col shadow-sm">
<!-- Minimal Back Header -->
<header class="flex items-center px-4 h-16 border-b border-divider-gray bg-white">
<button onclick="window.location.href='../hero/code.html'" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-pale-gray transition-colors">
<span class="material-symbols-outlined text-deep-charcoal">arrow_back</span>
</button>
<div class="flex-1 flex justify-center pr-10">
<div class="flex items-center gap-2">
<div class="w-8 h-8 bg-purple-heritage rounded flex items-center justify-center">
<span class="material-symbols-outlined text-white text-xl">travel_explore</span>
</div>
<span class="text-xl font-bold text-purple-heritage tracking-tight">Traveloop</span>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1">
<div class="relative flex h-auto w-full flex-col bg-[#faf9fa] group/design-root overflow-x-hidden" style='font-family: Inter, "Noto Sans", sans-serif;'>
<div class="@container">
<div class="@[480px]:px-4 @[480px]:py-3">
<div class="w-full bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden bg-[#faf9fa] @[480px]:rounded min-h-[218px]" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuA56TX2cR5rXsdE8vEW4DCz2tWF4ztE1a9bc74qF8FEOMdUpYvzH7e9o1mu8Jt8rbAwNtWcEi3hVoC5Q-DI7nR22QoZ7Jo-Iq26F7sGLhHFi25AvctRBYGACG5p6bCx7oOFo_saqETS_i2juTXTa4vb-G0w2h16ltESgcoBVCApjLDFemZz9RlCCm0Rqz1UhiYhcvCAmoRQZKe7Glc9IqfjYNjbfJjZSdqZgU6K7xAIv5ilqdFlzF-2UvAfvaXKDKOQLarIdJoki0Y");'>
</div>
</div>
</div>
<h3 class="text-[#161315] tracking-light text-2xl font-bold leading-tight px-4 text-center pb-2 pt-5">Welcome back</h3>
<p class="text-on-surface-variant text-center px-4 pb-4">Log in to continue your journey</p>

<form id="login-form" class="space-y-4 px-4">
    <div class="flex flex-col">
        <p class="text-[#161315] text-base font-medium leading-normal pb-2">Email</p>
        <input id="email" class="form-input flex w-full rounded border border-[#ded8dd] bg-[#faf9fa] focus:border-purple-heritage h-14 px-4 text-base font-normal" placeholder="Enter your email" type="email" required/>
    </div>
    <div class="flex flex-col">
        <p class="text-[#161315] text-base font-medium leading-normal pb-2">Password</p>
        <div class="relative flex items-stretch">
            <input id="password" class="form-input flex w-full rounded border border-[#ded8dd] bg-[#faf9fa] focus:border-purple-heritage h-14 px-4 pr-12 text-base font-normal" placeholder="Enter your password" type="password" required/>
            <button type="button" onclick="togglePassword()" class="absolute right-0 top-0 h-full px-4 text-[#7c6a77]">
                <span id="eye-icon" class="material-symbols-outlined">visibility</span>
            </button>
        </div>
    </div>
    <div class="flex justify-start">
        <button type="button" onclick="handleForgotPassword()" class="text-[#7c6a77] text-sm font-normal underline hover:text-purple-heritage">Forgot Password?</button>
    </div>
    <div class="py-4">
        <button type="submit" id="login-btn" class="w-full h-[50px] bg-purple-heritage text-white font-semibold rounded hover:bg-purple-dark transition-all flex items-center justify-center gap-2">
            <span>Log In</span>
            <span class="material-symbols-outlined text-[20px]">login</span>
        </button>
    </div>
</form>

<div class="flex items-center gap-4 px-4 py-2">
<div class="h-px bg-divider-gray flex-1"></div>
<span class="text-sm text-[#7c6a77]">Or sign in with</span>
<div class="h-px bg-divider-gray flex-1"></div>
</div>
<div class="flex flex-col gap-3 px-4 py-4">
<button onclick="signInWithGoogle()" id="google-signin-btn" class="w-full h-12 border border-border-subtle rounded flex items-center justify-center bg-white hover:bg-pale-gray transition-colors">
<img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5 mr-2">
<span class="text-sm font-medium">Google</span>
</button>
<button onclick="continueAsGuest()" class="w-full h-12 bg-pale-gray text-deep-charcoal font-semibold rounded hover:bg-divider-gray transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">person_outline</span>

</button>
</div>
<div class="mt-4 pb-12 px-4 text-center">
<p class="text-on-surface-variant text-sm">
                        New to Traveloop? 
                        <a class="text-purple-heritage font-semibold underline ml-1 hover:text-purple-dark" href="../signup/code.html">Sign up for an account</a>
</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    function togglePassword() {
        const pass = document.getElementById('password');
        const icon = document.getElementById('eye-icon');
        if (pass.type === 'password') {
            pass.type = 'text';
            icon.innerText = 'visibility_off';
        } else {
            pass.type = 'password';
            icon.innerText = 'visibility';
        }
    }

    // Login Logic
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        btn.disabled = true;
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">refresh</span> Logging in...';

        const { error } = await window.supabaseClient.auth.signInWithPassword({
            email,
            password,
        });

        if (error) {
            alert("Login Failed: " + error.message);
            btn.disabled = false;
            btn.innerHTML = '<span>Log In</span> <span class="material-symbols-outlined text-[20px]">login</span>';
        } else {
            window.location.href = '../traveloop_dashboard/code.html';
        }
    });

    // Google Login Logic
    window.signInWithGoogle = async function() {
        const btn = document.getElementById('google-signin-btn');
        const originalContent = btn.innerHTML;
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">refresh</span> Connecting...';
        btn.classList.add('opacity-70', 'pointer-events-none');

        const { error } = await window.supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: {
                redirectTo: window.location.origin + '/traveloop_dashboard/code.html'
            }
        });

        if (error) {
            alert("Google Login Failed: " + error.message);
            btn.innerHTML = originalContent;
            btn.classList.remove('opacity-70', 'pointer-events-none');
        }
    };

    window.handleForgotPassword = async function() {
        const email = document.getElementById('email').value;
        if (!email) {
            alert("Please enter your email address first.");
            return;
        }
        
        const { error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/auth/code.html',
        });

        if (error) {
            alert("Error: " + error.message);
        } else {
            alert("Password reset email sent! Check your inbox.");
        }
    };
</script>
<script src="../global.js"></script>

<script>
    // handleSignOut is now globally handled by global.js

    // Initialize stats and user info once Supabase is ready
    function initProfileData() {
        if (!window.supabaseClient) {
            setTimeout(initProfileData, 500);
            return;
        }

        window.supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (session && session.user) {
                const user = session.user;
                const metadata = user.user_metadata;

                // Update Profile Info
                document.getElementById('profile-name').innerText = metadata.full_name || 'Traveler';
                document.getElementById('profile-email').innerText = user.email;
                if (metadata.avatar_url) {
                    document.getElementById('profile-avatar-large').style.backgroundImage = `url('${metadata.avatar_url}')`;
                }

                // Fetch Real Stats from Supabase
                fetchStats(user.id);
            } else if (event === 'SIGNED_OUT') {
                window.location.href = '../auth/code.html';
            }
        });
    }

    async function fetchStats(userId) {
        try {
            // Count Trips
            const { count: tripsCount } = await window.supabaseClient
                .from('trips')
                .select('*', { count: 'exact', head: true })
                .eq('user_id', userId);

            document.getElementById('stat-trips').innerText = tripsCount || 0;

            // Count POIs
            const { count: poisCount } = await window.supabaseClient
                .from('saved_pois')
                .select('*', { count: 'exact', head: true })
                .eq('user_id', userId);

            document.getElementById('stat-pois').innerText = poisCount || 0;

            // Fetch 3 Recent Trips
            const { data: recentTrips } = await window.supabaseClient
                .from('trips')
                .select('*')
                .eq('user_id', userId)
                .order('created_at', { ascending: false })
                .limit(3);

            renderRecentTrips(recentTrips);

        } catch (err) {
            console.error("Error fetching profile stats:", err);
        }
    }

    function renderRecentTrips(trips) {
        const list = document.getElementById('recent-trips-list');
        if (!trips || trips.length === 0) {
            list.innerHTML = `<div class="p-8 text-center text-neutral-charcoal">No trips found yet. Start planning your first adventure!</div>`;
            return;
        }

        list.innerHTML = trips.map(trip => `
            <div class="flex items-center gap-4 p-4 border-b border-divider-gray last:border-0 hover:bg-pale-gray transition-colors cursor-pointer" onclick="window.location.href='../my_trips/code.html'">
                <div class="size-12 rounded-xl bg-purple-heritage/5 flex items-center justify-center text-purple-heritage">
                    <span class="material-symbols-outlined">map</span>
                </div>
                <div class="flex-1">
                    <h3 class="font-bold text-deep-charcoal">${trip.name}</h3>
                    <p class="text-sm text-neutral-charcoal">${new Date(trip.start_date).toLocaleDateString()} - ${new Date(trip.end_date).toLocaleDateString()}</p>
                </div>
                <span class="material-symbols-outlined text-divider-gray">chevron_right</span>
            </div>
        `).join('');
    }

    initProfileData();
</script>

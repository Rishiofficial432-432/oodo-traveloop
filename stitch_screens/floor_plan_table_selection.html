<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>World International Cafe — Floor Plan</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
<script src="../global.js"></script>
<script src="../nav.js"></script>
<script src="cafe.js"></script>
<script id="tailwind-config">
tailwind.config={darkMode:"class",theme:{extend:{colors:{"secondary-fixed-dim":"#78d5db","surface-container":"#e5eeff","outline":"#80747a","inverse-surface":"#27313e","background":"#f8f9ff","secondary-fixed":"#95f1f8","on-error":"#ffffff","inverse-on-surface":"#eaf1ff","surface-container-high":"#dfe9fa","secondary-container":"#92eff5","on-tertiary-container":"#cbcdce","error":"#ba1a1a","on-tertiary-fixed":"#191c1d","on-background":"#121c28","on-secondary-fixed-variant":"#004f53","surface-variant":"#d9e3f4","primary-fixed":"#ffd7f1","on-surface":"#121c28","on-primary-container":"#f0bfe0","surface":"#f8f9ff","on-surface-variant":"#4e444a","inverse-primary":"#e9b8d9","on-secondary":"#ffffff","tertiary-fixed":"#e1e3e4","primary-container":"#714b67","on-primary-fixed-variant":"#5f3b56","on-primary-fixed":"#2f1029","on-secondary-fixed":"#002022","error-container":"#ffdad6","primary-fixed-dim":"#e9b8d9","surface-tint":"#79526f","surface-container-highest":"#d9e3f4","surface-container-lowest":"#ffffff","tertiary":"#3d4041","secondary":"#00696e","primary":"#57344f","tertiary-container":"#555758","on-secondary-container":"#006e73","surface-bright":"#f8f9ff","on-tertiary":"#ffffff","outline-variant":"#d1c3ca","surface-dim":"#d1dbec","on-tertiary-fixed-variant":"#454748","surface-container-low":"#eef4ff","on-primary":"#ffffff","tertiary-fixed-dim":"#c5c7c8","on-error-container":"#93000a"},borderRadius:{DEFAULT:"0.125rem",lg:"0.25rem",xl:"0.5rem",full:"0.75rem"},spacing:{"margin-desktop":"32px",xs:"4px",md:"16px","margin-mobile":"16px",gutter:"16px",sm:"8px",base:"4px",xl:"32px",lg:"24px"},fontFamily:{"display-brand":["Caveat"],"label-md":["Inter"],"headline-md":["Inter"],"headline-lg":["Inter"],"body-md":["Inter"],"label-sm":["Inter"]},fontSize:{"label-md":["14px",{lineHeight:"20px",fontWeight:"500"}],"headline-md":["24px",{lineHeight:"32px",fontWeight:"600"}],"display-brand":["40px",{lineHeight:"48px",fontWeight:"700"}],"headline-lg":["32px",{lineHeight:"40px",fontWeight:"600"}],"body-md":["16px",{lineHeight:"24px",fontWeight:"400"}],"label-sm":["12px",{lineHeight:"16px",letterSpacing:"0.02em",fontWeight:"600"}]}}}}
</script>
<style>
  .no-scrollbar::-webkit-scrollbar{display:none}
  .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
  .skeleton{background:linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 50%,#e5e7eb 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .table-card{transition:transform .15s ease,box-shadow .15s ease}
  .table-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.12)}
  body{font-family:Inter,sans-serif}
</style>
</head>
<body class="bg-background text-on-background h-screen overflow-hidden">

<!-- TOP NAV (Explicit Step-by-Step) -->
<nav class="fixed top-0 w-full h-16 bg-surface-container-lowest border-b border-outline-variant shadow-sm flex items-center justify-between px-md z-50" style="font-family:Inter,sans-serif">
  <button onclick="window.location.href='../traveloop_dashboard.html'" class="flex items-center gap-2 px-4 py-2 rounded-lg text-primary font-bold hover:bg-surface-variant transition-colors border border-outline-variant">
    <span class="material-symbols-outlined">arrow_back</span>
    Back to Hub
  </button>
  
  <div class="flex flex-col items-center">
    <span class="text-label-sm text-on-surface-variant uppercase tracking-widest">Step 1 of 4</span>
    <span class="font-headline-md text-[18px] text-on-background font-bold">Floor Plan</span>
  </div>

  <div class="flex items-center gap-3">
    <div id="sync-dot" class="w-2 h-2 rounded-full bg-secondary-fixed animate-pulse mr-2" title="Live sync active"></div>
    <button onclick="window.location.href='pos_order_view_terminal.html'" class="flex items-center gap-2 px-5 py-2 rounded-lg bg-primary text-on-primary font-bold hover:brightness-110 transition-colors shadow-md">
      Next: POS Terminal
      <span class="material-symbols-outlined">arrow_forward</span>
    </button>
  </div>
</nav>

<!-- MAIN -->
<main class="pt-[80px] px-margin-mobile md:px-margin-desktop pb-xl max-w-[1440px] mx-auto h-full overflow-y-auto">

  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-center justify-between mb-lg gap-md mt-lg">
    <div>
      <h1 class="font-headline-md text-headline-md text-on-background">Floor Plan</h1>
      <p class="text-body-md text-on-surface-variant mt-xs">Select a table to start or manage an order.</p>
    </div>
    <!-- Zone tabs -->
    <div id="zone-tabs" class="flex items-center overflow-x-auto no-scrollbar gap-sm p-1 bg-surface-container-high rounded-lg shadow-[inset_0px_1px_2px_rgba(0,0,0,0.05)] w-full md:w-auto">
      <div class="skeleton h-10 w-28 rounded-md"></div>
      <div class="skeleton h-10 w-24 rounded-md"></div>
      <div class="skeleton h-10 w-24 rounded-md"></div>
    </div>
  </div>

  <!-- Stats bar -->
  <div class="flex items-center gap-lg mb-md flex-wrap">
    <div class="flex items-center gap-xs">
      <div class="w-3 h-3 rounded-full bg-surface-container-lowest border border-outline-variant"></div>
      <span class="text-label-sm text-on-surface-variant">Available</span>
    </div>
    <div class="flex items-center gap-xs">
      <div class="w-3 h-3 rounded-full bg-primary-container border-2 border-primary"></div>
      <span class="text-label-sm text-on-surface-variant">Occupied</span>
    </div>
    <div class="flex items-center gap-xs">
      <div class="w-3 h-3 rounded-full bg-secondary-fixed border-2 border-secondary"></div>
      <span class="text-label-sm text-on-surface-variant">Ready to serve</span>
    </div>
    <span id="stats-text" class="ml-auto text-label-sm text-on-surface-variant"></span>
  </div>

  <!-- Table Grid -->
  <div id="table-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-md md:gap-lg">
    <div class="skeleton min-h-[140px]"></div>
    <div class="skeleton min-h-[140px]"></div>
    <div class="skeleton min-h-[140px]"></div>
    <div class="skeleton min-h-[140px]"></div>
    <div class="skeleton min-h-[140px]"></div>
    <div class="skeleton min-h-[140px]"></div>
  </div>

</main>

<script>
let currentZone = null;

async function boot() {
  const tables = await getTablesWithStatus();
  const zones = [...new Set(tables.map(t => t.zone))];
  if (!currentZone) currentZone = zones[0];
  renderZoneTabs(zones, tables);
  renderTables(tables);
}

function renderZoneTabs(zones, tables) {
  const container = document.getElementById('zone-tabs');
  container.innerHTML = '';
  zones.forEach(zone => {
    const count = tables.filter(t => t.zone === zone).length;
    const active = zone === currentZone;
    const btn = document.createElement('button');
    btn.className = active
      ? 'text-label-md bg-surface-container-lowest text-primary shadow-sm px-5 py-2.5 rounded-md whitespace-nowrap transition-all border border-outline-variant/30 font-bold'
      : 'text-label-md text-on-surface-variant hover:text-on-surface hover:bg-surface-variant/50 px-5 py-2.5 rounded-md whitespace-nowrap transition-all';
    btn.innerHTML = `${zone} <span class="ml-1 text-[11px] opacity-60">${count}</span>`;
    btn.addEventListener('click', () => { currentZone = zone; boot(); });
    container.appendChild(btn);
  });
}

async function renderTables(allTables) {
  const tables = allTables || await getTablesWithStatus();

  // Annotate ready status
  for (const t of tables) {
    if (t.openOrderId) {
      const order = await getOrder(t.openOrderId);
      if (order) t.orderStatus = order.status;
    }
  }

  const filtered = tables.filter(t => t.zone === currentZone);
  const grid = document.getElementById('table-grid');

  const occupied = filtered.filter(t => t.occupied).length;
  const total = filtered.length;
  document.getElementById('stats-text').textContent = `${occupied} of ${total} tables occupied`;

  grid.innerHTML = '';
  filtered.forEach(table => {
    const isReady = table.orderStatus === 'ready';
    const isOccupied = table.occupied;

    let cardClass, numClass, badgeClass, labelText, totalHtml;

    if (isReady) {
      cardClass = 'bg-secondary-fixed border-2 border-secondary cursor-pointer';
      numClass = 'text-on-background';
      badgeClass = 'text-secondary bg-secondary/10';
      labelText = 'Ready';
      totalHtml = `<div class="text-label-md text-secondary font-bold">₹${table.total.toFixed(0)}</div>`;
    } else if (isOccupied) {
      cardClass = 'bg-primary-container border-2 border-primary cursor-pointer';
      numClass = 'text-on-primary-container';
      badgeClass = 'text-on-primary-container/80 bg-on-primary/20';
      labelText = 'Occupied';
      totalHtml = `<div class="text-label-md text-on-primary-container font-bold">₹${table.total.toFixed(0)}</div>`;
    } else {
      cardClass = 'bg-surface-container-lowest border border-outline-variant cursor-pointer hover:border-secondary hover:shadow-md';
      numClass = 'text-on-surface';
      badgeClass = 'text-on-surface-variant bg-surface-variant';
      labelText = 'Available';
      totalHtml = '';
    }

    const btn = document.createElement('button');
    btn.className = `table-card relative flex flex-col justify-between ${cardClass} rounded-xl p-md shadow-sm min-h-[140px] text-left group`;
    btn.innerHTML = `
      <div class="flex justify-between items-start w-full">
        <span class="font-headline-lg text-headline-lg ${numClass} group-active:scale-95 transition-transform">${table.number}</span>
        <div class="flex items-center ${badgeClass} px-2 py-0.5 rounded-full">
          <span class="material-symbols-outlined text-[13px] mr-1" ${isOccupied ? "style=\"font-variation-settings:'FILL' 1\"" : ''}>person</span>
          <span class="text-label-sm">${table.capacity}</span>
        </div>
      </div>
      <div class="mt-auto">
        <div class="text-label-sm ${isOccupied || isReady ? (isReady ? 'text-secondary' : 'text-on-primary-container/80') : 'text-on-surface-variant'} uppercase tracking-wider mb-0.5">${labelText}</div>
        ${totalHtml}
      </div>`;

    btn.addEventListener('click', () => {
      window.location.href = `pos_order_view_terminal.html?table=${table.id}`;
    });

    grid.appendChild(btn);
  });
}

document.addEventListener('DOMContentLoaded', async () => {
  await boot();
  // Live sync from KDS/POS changes
  subscribeCafe(() => boot());
  // Refresh stats every 30s
  setInterval(() => boot(), 30000);
});
</script>
</body>
</html>

<!-- Dynamic tickets will be injected here -->
</div>

<script>
    async function loadKitchenOrders() {
        const orders = await getActiveKitchenOrders();
        
        // Sort oldest first based on sent_at or created_at
        orders.sort((a, b) => new Date(a.sent_at || a.created_at) - new Date(b.sent_at || b.created_at));

        const grid = document.getElementById('kds-grid');
        const badge = document.getElementById('kds-prep-badge');
        
        if (orders.length > 0) {
            badge.textContent = orders.length;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }

        grid.innerHTML = '';
        
        if (orders.length === 0) {
            grid.innerHTML = '<div class="col-span-full text-center py-16 text-on-surface-variant font-label-md">No active orders right now.</div>';
            return;
        }

        for (const order of orders) {
            let tableText = 'Takeout';
            if (order.table_id) {
                const table = await db.cafe_tables.get(order.table_id);
                if (table) tableText = `Table ${table.number}`;
            }

            const isUrgent = getElapsedMinutes(order.sent_at || order.created_at) > 15;
            const topColor = isUrgent ? 'border-t-error' : 'border-t-secondary';
            const headBg = isUrgent ? 'bg-error/10' : 'bg-secondary/10';
            
            const card = document.createElement('article');
            card.className = `ticket-glass rounded-xl border-t-4 ${topColor} border border-outline flex flex-col h-[420px] shadow-[0_8px_30px_rgb(0,0,0,0.12)] transform transition-transform hover:-translate-y-1`;
            
            let itemsHtml = '';
            (order.items || []).forEach((item, idx) => {
                const isDone = item.done;
                const icon = isDone ? 'check_box' : 'check_box_outline_blank';
                const iconColor = isDone ? 'text-secondary-fixed' : 'text-outline';
                const opacity = isDone ? 'opacity-50' : '';
                const lineThrough = isDone ? 'line-through text-tertiary-fixed-dim' : 'text-on-tertiary';
                const iconFill = isDone ? "font-variation-settings: 'FILL' 1;" : "";

                let notesHtml = '';
                if (item.notes) {
                    notesHtml = `<p class="font-label-sm text-label-sm text-error bg-error/20 inline-block px-1.5 py-0.5 rounded mt-0.5">${item.notes}</p>`;
                }

                itemsHtml += `
                <div class="flex items-start gap-sm py-2 group cursor-pointer hover:bg-white/5 rounded-md px-1 -mx-1 transition-colors ${opacity}" onclick="toggleKdsItem(${order.id}, ${idx})">
                    <span class="material-symbols-outlined ${iconColor} shrink-0 mt-0.5" style="${iconFill}">${icon}</span>
                    <div class="flex-1">
                        <p class="font-body-md text-body-md ${lineThrough} font-medium">${item.qty}x ${item.name}</p>
                        ${notesHtml}
                    </div>
                </div>`;
            });

            card.innerHTML = `
            <div class="p-md border-b border-outline/50 flex justify-between items-start ${headBg} rounded-t-lg">
                <div>
                    <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-tertiary leading-none mb-1">#${order.id}</h2>
                    <span class="font-label-md text-label-md text-tertiary-fixed-dim flex items-center gap-1">
                        <span class="material-symbols-outlined text-[14px]">table_restaurant</span> ${tableText}
                    </span>
                </div>
                <div class="flex flex-col items-end text-right">
                    <span class="kds-timer font-label-md text-label-md ${isUrgent ? 'text-error animate-pulse font-bold' : 'text-secondary-fixed'} flex items-center gap-1" data-time="${order.sent_at || order.created_at}">
                        <span class="material-symbols-outlined text-[16px]">schedule</span> <span>Calculating...</span>
                    </span>
                    <span class="font-label-sm text-label-sm ${isUrgent ? 'bg-tertiary-container text-on-tertiary-container' : 'bg-primary text-on-primary'} px-2 py-0.5 rounded mt-1">${order.order_type}</span>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-md space-y-1 custom-scrollbar">
                ${itemsHtml}
            </div>
            <div class="p-md border-t border-outline/50 bg-tertiary/50 rounded-b-xl shrink-0 mt-auto">
                <button onclick="markKdsComplete(${order.id})" class="w-full bg-secondary hover:bg-secondary-container hover:text-on-secondary-container text-on-secondary font-label-md text-label-md py-3 px-4 rounded-lg flex justify-between items-center transition-colors shadow-sm group">
                    <span>Move to Completed</span>
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
                </button>
            </div>`;
            
            grid.appendChild(card);
        }
        updateTimers();
    }

    function getElapsedMinutes(dateStr) {
        if (!dateStr) return 0;
        return Math.floor((new Date() - new Date(dateStr)) / 60000);
    }

    function updateTimers() {
        document.querySelectorAll('.kds-timer').forEach(el => {
            const timeStr = el.getAttribute('data-time');
            if (timeStr) {
                const mins = getElapsedMinutes(timeStr);
                const textSpan = el.querySelector('span:last-child');
                if (textSpan) {
                    if (mins < 1) textSpan.textContent = 'Just now';
                    else textSpan.textContent = mins + 'm ago';
                }
            }
        });
    }

    window.toggleKdsItem = async function(orderId, itemIdx) {
        await toggleOrderItemDone(orderId, itemIdx);
        // Rendering triggers via the cafeChanged event automatically!
    };

    window.markKdsComplete = async function(orderId) {
        await completeOrder(orderId);
    };

    document.addEventListener('DOMContentLoaded', async () => {
        await loadKitchenOrders();
        setInterval(updateTimers, 10000); // update times every 10s
        subscribeCafe(loadKitchenOrders);
    });
</script>

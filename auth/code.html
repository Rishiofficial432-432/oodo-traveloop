<style>

<body class="bg-surface font-['Inter'] text-deep-charcoal min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-divider-gray relative">
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-purple-heritage to-teal-primary"></div>
        
        <div class="p-8">
            <div class="flex justify-center mb-6">
                <div class="size-16 bg-pale-gray rounded-full flex items-center justify-center text-purple-heritage">
                    <span class="material-symbols-outlined text-[32px]">account_circle</span>
                </div>
            </div>
            
            <h2 class="text-center text-2xl font-bold text-deep-charcoal mb-2">Welcome to Traveloop</h2>
            <p class="text-center text-neutral-charcoal text-sm mb-8">Please sign in or create an account to continue.</p>
            
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-neutral-charcoal mb-1">Email Address</label>
                    <input type="email" class="w-full h-12 px-4 rounded-lg border border-border-subtle focus:border-purple-heritage focus:ring-2 focus:ring-purple-heritage/20 outline-none transition-all" placeholder="you@example.com" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-neutral-charcoal mb-1">Password</label>
                    <input type="password" class="w-full h-12 px-4 rounded-lg border border-border-subtle focus:border-purple-heritage focus:ring-2 focus:ring-purple-heritage/20 outline-none transition-all" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="w-full h-12 mt-6 bg-purple-heritage text-white font-bold rounded-lg hover:bg-purple-dark transition-colors shadow-md">
                    Continue
                </button>
            </form>
            
            <div class="mt-6 relative">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-divider-gray"></div></div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white text-neutral-charcoal">Or continue with</span>
                </div>
            </div>
            
            <div class="mt-6 flex gap-3">
                <button id="google-signin-btn" class="flex-1 h-12 border border-border-subtle rounded-lg flex items-center justify-center gap-2 hover:bg-pale-gray transition-colors cursor-pointer" onclick="signInWithGoogle()">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
                    <span class="font-semibold text-sm">Google</span>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        window.signInWithGoogle = async function() {
            const btn = document.getElementById('google-signin-btn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">refresh</span> <span class="font-semibold text-sm">Connecting to Supabase...</span>';
            btn.classList.add('opacity-70', 'pointer-events-none');

            if (typeof supabase === 'undefined' || !window.supabaseClient) {
                alert("Supabase is still initializing...");
                btn.innerHTML = originalContent;
                btn.classList.remove('opacity-70', 'pointer-events-none');
                return;
            }

            const { data, error } = await window.supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/traveloop_dashboard/code.html'
                }
            });

            if (error) {
                console.error("Supabase Login Error:", error.message);
                alert("Login Failed: " + error.message);
                btn.innerHTML = originalContent;
                btn.classList.remove('opacity-70', 'pointer-events-none');
            }
        };
    </script>
    <script src="../global.js"></script>
</body>
</html>
